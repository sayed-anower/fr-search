[package]
name = "fr-search"
version = "0.1.0"
edition = "2021"
authors = ["Sayed Anower <sayed.anower.17.2@gmail.com>"]
license = "MIT"
repository = "https://github.com/sayed-anower/fr-search"
documentation = "https://docs.rs/fr-search"
readme = "README.md"
keywords = ["search", "suggestions", "fst", "fts", "fasttext"]
categories = ["asynchronous"]

[dependencies]
tokio = { version = "1", features = ["full", "sync"] }
tantivy = "0.22"
fasttext = "0.7"
fst = "0.4.7"
thiserror = "2.0.18"